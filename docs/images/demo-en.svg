<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920">
  <title>SoundFinder for Alfred — English interface mockup</title>
  <desc>Illustrative Alfred results for an audio-playing Chrome tab, a muted Chrome tab, Godot, and Music. Example data; the shipping workflow interface remains Chinese.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1440" y2="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14202c"/><stop offset="1" stop-color="#080e16"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000000" flood-opacity=".5"/>
    </filter>
    <g id="chrome">
      <circle cx="27" cy="27" r="27" fill="#ffffff"/>
      <path d="M27 2A25 25 0 0 1 49 15H27L16 34L5 15A25 25 0 0 1 27 2" fill="#ea4335"/>
      <path d="M49 15A25 25 0 0 1 28 52L39 33L27 15Z" fill="#fbbc05"/>
      <path d="M28 52A25 25 0 0 1 5 15L16 34L39 33Z" fill="#34a853"/>
      <circle cx="27" cy="27" r="12" fill="#4285f4" stroke="#ffffff" stroke-width="3"/>
    </g>
    <g id="audio">
      <rect width="54" height="54" rx="13" fill="#247b98"/>
      <path d="M11 23H18L27 15V39L18 31H11Z" fill="#ffffff"/>
      <path d="M33 21Q39 27 33 33M38 16Q49 27 38 38" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="1440" height="920" fill="url(#background)"/>
  <g font-family="Helvetica Neue, Helvetica, sans-serif">
    <text x="122" y="92" fill="#eff8fc" font-size="34" font-weight="650">SoundFinder</text>
    <text x="352" y="91" fill="#8496a6" font-size="22">for Alfred</text>
    <rect x="1093" y="62" width="225" height="38" rx="19" fill="#223342"/>
    <text x="1205" y="87" text-anchor="middle" fill="#acbfce" font-size="16" letter-spacing="1.2">ENGLISH UI MOCKUP</text>
    <g filter="url(#shadow)">
      <rect x="112" y="143" width="1216" height="579" rx="38" fill="#25272b" stroke="#72767c" stroke-width="2"/>
      <rect x="128" y="159" width="1184" height="112" rx="26" fill="#303236"/>
      <text x="156" y="232" fill="#f4f5f7" font-size="48" font-weight="400">sound</text>
      <rect x="128" y="288" width="1184" height="99" rx="18" fill="#3b4654"/>
      <use href="#chrome" x="156" y="309"/>
      <text x="235" y="327" fill="#ffffff" font-size="27" font-weight="550">Chrome · Ambient Focus — Demo</text>
      <text x="235" y="362" fill="#c2d3df" font-size="21">Audio playing · Background tab · Return to jump</text>
      <text x="1260" y="347" text-anchor="middle" fill="#cad6e1" font-size="29">↵</text>
      <use href="#chrome" x="156" y="415"/>
      <text x="235" y="434" fill="#f1f3f5" font-size="27" font-weight="500">Chrome · Rolling Republic — Crayon</text>
      <text x="235" y="469" fill="#a4adb9" font-size="21">Muted · Background tab · Return to jump</text>
      <text x="1271" y="452" text-anchor="end" fill="#78818e" font-size="21">⌘2</text>
      <rect x="156" y="521" width="54" height="54" rx="13" fill="#417da4"/>
      <path d="M166 537L173 541L181 534L189 541L198 537V562H166Z" fill="#dfedf5"/>
      <circle cx="176" cy="550" r="3.5" fill="#417da4"/><circle cx="190" cy="550" r="3.5" fill="#417da4"/>
      <path d="M176 559H190" stroke="#417da4" stroke-width="3" stroke-linecap="round"/>
      <text x="235" y="540" fill="#f1f3f5" font-size="27" font-weight="500">Godot</text>
      <text x="235" y="575" fill="#a4adb9" font-size="21">Output stream active · PID 20811 · Headphones · Return to focus app</text>
      <text x="1271" y="558" text-anchor="end" fill="#78818e" font-size="21">⌘3</text>
      <use href="#audio" x="156" y="627"/>
      <text x="235" y="646" fill="#f1f3f5" font-size="27" font-weight="500">Music</text>
      <text x="235" y="681" fill="#a4adb9" font-size="21">Output stream active · PID 79780 · Headphones · Return to focus app</text>
      <text x="1271" y="664" text-anchor="end" fill="#78818e" font-size="21">⌘4</text>
    </g>
    <text x="122" y="786" fill="#70ddd2" font-size="23" font-weight="550">Find the source. Jump to it.</text>
    <text x="122" y="824" fill="#9cabb8" font-size="19">No Chrome extension · No recording · No background service</text>
    <text x="122" y="874" fill="#8292a1" font-size="16">Illustrative example data. The current workflow UI is Chinese; muted tabs are not audible.</text>
  </g>
</svg>
